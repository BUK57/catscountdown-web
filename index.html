<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/webp" href="app_icon.webp">
    <style>
        * {
            margin: 0;

            box-sizing: border-box;
        }

        body {
            background-color: #45C6D6;

            height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        .icon {

            height: 160px;
            border-radius: 36px;

        }

            font-size: 2rem;
            font-weight: 700;
            color: #1A1A1A;

            margin-bottom: 24px;
            text-align: center;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }
        }

        .badge img {
            height: 72px;
        }

        footer {
            position: fixed;
            bottom: 16px;
            font-size: 0.85rem;
        }

        footer a {
            color: #1A1A1A;

            text-decoration: none;

    <img src="app_icon.webp" alt="Cats Countdown" class="icon">
