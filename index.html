<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cats Countdown: Days Counter</title>
    <link rel="icon" type="image/webp" href="app_icon.webp">
    <script id="usercentrics-cmp" src="https://app.usercentrics.eu/browser-ui/latest/loader.js" data-settings-id="NLKs8lmq4ZlJfq" async></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S0611TDE0N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-S0611TDE0N');
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #45C6D6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 60px 0 80px;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            margin-bottom: 40px;
        }

        .icon {
            width: 160px;
            height: 160px;
            border-radius: 36px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1A1A1A;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            text-align: center;
        }

        .tagline {
            font-size: 1rem;
            color: #4A4A4A;
            text-align: center;
            margin-bottom: 24px;
        }

        .badge img {
            height: 72px;
        }

        .screenshots-wrapper {
            width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .screenshots-wrapper::-webkit-scrollbar {
            display: none;
        }

        .screenshots {
            display: flex;
            flex-direction: row;
            gap: 12px;
            padding: 0 24px;
            width: max-content;
            margin: 0 auto;
        }

        .screenshots img {
            height: 320px;
            width: auto;
            border-radius: 16px;
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }
            .screenshots img { height: 220px; }
        }

        footer {
            position: fixed;
            bottom: 16px;
            font-size: 0.85rem;
        }

        footer a {
            color: #1A1A1A;
            opacity: 0.5;
            text-decoration: none;
        }

        footer a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="app_icon.webp" alt="Cats Countdown" class="icon">
        <h1>Cats Countdown: Days Counter</h1>
        <p class="tagline">A cute cat countdown app &amp; widget to track your birthdays, vacations &amp; events!</p>
        <a class="badge" href="https://play.google.com/store/apps/details?id=com.catscountdown.app" target="_blank">
            <img src="PreRegisterOnGooglePlay_Badge_Web_color_english.png.png" alt="Pre-register on Google Play">
        </a>
    </div>
    <div class="screenshots-wrapper">
    <div class="screenshots">
        <img src="001.png" alt="Screenshot 1">
        <img src="002.png" alt="Screenshot 2">
        <img src="003.png" alt="Screenshot 3">
        <img src="004.png" alt="Screenshot 4">
        <img src="005.png" alt="Screenshot 5">
        <img src="006.png" alt="Screenshot 6">
    </div>
    </div>
    <script>
        function updateScroll() {
            document.body.style.overflowY = document.body.scrollHeight <= window.innerHeight ? 'hidden' : '';
        }
        updateScroll();
        window.addEventListener('resize', updateScroll);
    </script>
    <footer>
        <a href="/privacy-policy">Privacy Policy</a>
        <span style="opacity: 0.3; margin: 0 8px;">·</span>
        <a href="/pre-registration-terms">Pre-Registration Terms</a>
        <span style="opacity: 0.3; margin: 0 8px;">·</span>
        <a href="#" onclick="UC_UI.showSecondLayer();">Privacy Settings</a>
    </footer>
</body>
</html>
