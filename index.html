<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cats Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #E8828A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .icon {
            width: 120px;
            height: 120px;
            border-radius: 26px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1A1A1A;
            letter-spacing: -0.5px;
        }

        p {
            margin-top: 8px;
            font-size: 1rem;
            color: #1A1A1A;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <img src="icon.png" alt="Cats Countdown" class="icon">
    <h1>Cats Countdown</h1>
    <p>Coming Soon...</p>
</body>
</html>
